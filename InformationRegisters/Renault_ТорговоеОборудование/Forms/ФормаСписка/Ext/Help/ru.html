<h1>Регистр сведений «Торговое оборудование»</h1>
<p>В регистре сведений хранится информация о том списке торгового оборудования, который может быть подключен к рабочему месту пользователя. Список подключаемого торгового оборудования указывается в обработке «Настройка торгового оборудования».</p></body></html>
