<h3>Назначение</h3>
<p>Обработка<font face="Times New Roman"> «</font><font face="Arial Unicode MS">Софт</font><font face="Arial Unicode MS">Фон внешняя панель</font><font face="Times New Roman">» </font><font face="Tahoma">предназначена</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">для</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">управления</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">внутренними</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">и</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">внешними</font><font face="Times New Roman">, </font><font face="Arial Unicode MS">входящими</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">и</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">исходящими</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">телефонными</font><font face="Times New Roman"> </font><font face="Arial Unicode MS">звонками через отдельно установленную программу "Внешняя панель СофтФон".</font></p>
