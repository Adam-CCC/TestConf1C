<h1><font color="#413003">Форма списка телефонов</font></h1>
<h3><font color="#413003">Назначение</font></h3>
<p><font color="#413003">Форма предназначена для быстрого поиска контактной информации и выбора телефонного номера. Открытие формы происходит при нажатии на кнопку "Подбор" в документе "SMS Сообщение" или при вводе новой строки документа. <br></font></p></font></body></html>
