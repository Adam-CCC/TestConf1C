<h1><font color="#000080">Отчет "Печать списка рабочих листов"</font></h1>
<h3>Назначение</h3>
<p class="Usual">Служебный отчет для печати справочников.  Позволяет печатать список рабочих листов. </p>
<p class="Usual">Относится к подсистеме: <a href="Subsystem.СтруктураКонфигурации.Subsystem.Обработки.Subsystem.Сервис/Help">«Сервис»</a>.</p>
<h3>Формы</h3>
<ul><li><strong>Настройки печати справочника</strong>. Основная форма настроек формирования отчета.</li></ul></body></html>
