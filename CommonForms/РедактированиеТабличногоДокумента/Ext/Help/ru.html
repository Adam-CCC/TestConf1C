<p><strong>Важно: </strong>при редактировании макетов печатных форм необходимо иметь в виду, что изменение имен областей, а также параметров макета может привести к потере работоспособности печатной формы. Для восстановления стандартной печатной формы необходимо перейти к списку <a href="../idb67914a8-d483-4bed-bd4d-a4aadd4998a4/038b5c85-fb1c-4082-9c4c-e69f8928bf3a">Макеты печатных форм</a>.</p></body></html>
